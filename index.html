<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Analysis Calculator</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" type="image/png" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js');
      });
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .menu {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
    }
    .menu button {
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      flex: 1 1 40%;
      max-width: 160px;
    }
    .calculator {
      display: none;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button.calculate {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
    .footer {
      text-align: center;
      margin-top: 50px;
      font-size: 14px;
      color: #666;
    }
    .watermark {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 12px;
      color: #aaa;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Water Analysis Calculator</h1>
  <div class="menu">
    <button onclick="showCalculator('chloride')">Chloride</button>
    <button onclick="showCalculator('calcium')">Ca Hardness</button>
    <button onclick="showCalculator('total')">Total Hardness</button>
    <button onclick="showCalculator('alkalinity')">M Alkalinity</button>
  </div>

  <div id="chloride" class="calculator">
    <h2>Chloride</h2>
    <input type="number" id="chlorideInput" placeholder="Jumlah larutan titrasi" />
    <button class="calculate" onclick="calculate('chloride')">Hitung</button>
    <div class="result" id="chlorideResult"></div>
  </div>

  <div id="calcium" class="calculator">
    <h2>Ca Hardness</h2>
    <input type="number" id="calciumInput" placeholder="Jumlah larutan titrasi" />
    <button class="calculate" onclick="calculate('calcium')">Hitung</button>
    <div class="result" id="calciumResult"></div>
  </div>

  <div id="total" class="calculator">
    <h2>Total Hardness</h2>
    <input type="number" id="totalInput" placeholder="Jumlah larutan titrasi" />
    <button class="calculate" onclick="calculate('total')">Hitung</button>
    <div class="result" id="totalResult"></div>
  </div>

  <div id="alkalinity" class="calculator">
    <h2>M Alkalinity</h2>
    <input type="number" id="alkalinityInput" placeholder="Jumlah larutan titrasi" />
    <button class="calculate" onclick="calculate('alkalinity')">Hitung</button>
    <div class="result" id="alkalinityResult"></div>
  </div>

  <div class="footer">WTP MPSI BOSKU</div>
  <div class="watermark">WTP MPSI BOSKU</div>

  <script>
    function showCalculator(type) {
      document.querySelectorAll('.calculator').forEach(div => div.style.display = 'none');
      document.getElementById(type).style.display = 'block';
    }

    function calculate(type) {
      const input = parseFloat(document.getElementById(`${type}Input`).value);
      if (isNaN(input)) {
        alert("Masukkan angka yang valid");
        return;
      }

      let result = 0;
      switch (type) {
        case 'chloride':
          result = input * 13.9;
          break;
        case 'calcium':
        case 'total':
        case 'alkalinity':
          result = input * 40;
          break;
      }

      document.getElementById(`${type}Result`).innerText = `Hasil: ${result.toFixed(2)}`;
    }
  </script>
</body>
</html>
